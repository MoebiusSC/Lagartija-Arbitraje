<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arbitraje · Paper</title>
<style>body{background:#101827;color:#eef2f8;font:16px system-ui;margin:0;padding:30px;max-width:1100px;margin:auto}h1{font-size:32px}small{color:#aab8cb}.cards{display:flex;gap:20px;flex-wrap:wrap}article{background:#1b283d;border-radius:14px;padding:20px;flex:1;min-width:240px}strong{font-size:28px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #344056}input,button{padding:10px;background:#253652;color:white;border:1px solid #64748b;border-radius:6px}pre{white-space:pre-wrap;word-break:break-word}#error{color:#ffb9a5}</style>
<h1>Arbitraje <small>BTC 5 min · Paper</small></h1><p>Simulación con datos reales. Los fills maker son estimados; estos resultados no acreditan rentabilidad real.</p>
<input id="token" type="password" placeholder="Token del panel"><button id="connect">Conectar</button><p id="error"></p><p id="status">Esperando datos…</p><div class="cards" id="cards"></div>
<h2>Libro de órdenes</h2><div id="books"></div><h2>Últimos eventos</h2><table><thead><tr><th>Hora</th><th>Estrategia</th><th>Evento</th><th>PnL</th></tr></thead><tbody id="events"></tbody></table>
<script>let token='';document.getElementById('connect').onclick=()=>{token=document.getElementById('token').value;refresh()};const money=x=>Number(x).toFixed(2);function cell(row,value){const c=document.createElement('td');c.textContent=value;row.append(c)}async function refresh(){try{const r=await fetch('/api/state',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Acceso pendiente: introduce el token configurado.');const s=await r.json();document.getElementById('error').textContent='';document.getElementById('status').textContent=(s.status.connected?'Feed conectado':'Feed desconectado')+' · '+(s.status.market||'Buscando mercado')+' · '+(s.status.error||'')+' · Comisión asumida: '+s.status.fee_rate_assumption;const cards=document.getElementById('cards');cards.replaceChildren();for(const [name,v]of Object.entries(s.strategies)){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=name;a.append(h);const p=document.createElement('strong');p.textContent='$'+money(v.pnl)+' realizado';a.append(p);const info=document.createElement('p');info.textContent='Efectivo $'+money(v.cash)+' · Cierres '+v.trades+' · Coberturas fallidas '+v.failed_hedges+' · '+(v.halted?'DETENIDO: exposición pendiente':v.pending?'Posición pendiente':v.quote?'Orden maker pendiente':'Observando');a.append(info);cards.append(a)}document.getElementById('books').textContent=s.books.map((b,i)=>(i?'Down':'Up')+': bid '+b.bid+' / ask '+b.ask+' · edad '+(b.age_seconds===null?'—':b.age_seconds.toFixed(1)+' s')).join(' | ');const rows=document.getElementById('events');rows.replaceChildren();for(const e of s.events){const row=document.createElement('tr');cell(row,new Date(e.time*1000).toLocaleTimeString());cell(row,e.strategy);cell(row,e.kind);cell(row,e.pnl===undefined?'—':'$'+money(e.pnl));rows.append(row)}}catch(e){document.getElementById('error').textContent=e.message}}refresh();setInterval(refresh,3000)</script></html>
